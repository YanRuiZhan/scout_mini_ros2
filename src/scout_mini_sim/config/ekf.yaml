# robot_localization EKF：融合 FAST-LIO2、轮式里程计和 IMU，发布 /odom 与 TF odom -> base_footprint。
#
# 各传感器的分工：
#   - FAST-LIO2 位姿 /lio/odom（x、y、yaw，10 Hz）：位置和航向的主要来源，不受车轮打滑影响。
#     由 lio_to_odom.py 从 FAST-LIO 的 /Odometry 换算并补偿处理延迟，只有启动 lio.launch.py 时才有。
#   - 轮式里程计 /wheel/odom（vx，以及差速约束 vy=0）：补齐两帧雷达之间的平移。
#   - IMU 陀螺仪 /imu/data（vyaw）：补齐两帧雷达之间的转动。
# 没有启动 FAST-LIO 时，EKF 只用轮速 + IMU，仍能正常输出（航向不受打滑影响，位置会慢慢漂移）。
# 输出在 sim.launch.py 中重映射为 /odom，Nav2 等下游节点无需修改。
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    two_d_mode: true          # 平面运动：忽略 z / roll / pitch
    publish_tf: true

    map_frame: map            # 由 AMCL 发布 map -> odom，EKF 不参与
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom         # 本 EKF 只做局部（连续、无跳变）里程计

    # 不开启 smooth_lagged_data：它在每条时间戳较旧的数据到达时回退并重放历史，
    # 200 Hz IMU 与 50 Hz 轮速交错到达就会频繁触发，单轮耗时达 0.1~0.2 s，
    # 里程计降到 5~10 Hz 且滞后，控制器跟不上路径。FAST-LIO 的处理延迟改由
    # lio_to_odom.py 补偿：发布前把 LIO 位姿用 EKF 的运动推算到当前时刻。
    smooth_lagged_data: false

    # 每个 *_config 依次为：
    # [x, y, z, roll, pitch, yaw,
    #  vx, vy, vz, vroll, vpitch, vyaw,
    #  ax, ay, az]
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10

    odom1: /lio/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 50
