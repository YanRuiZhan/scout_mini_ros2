# Based on the installed ROS 2 Humble nav2_bringup and slam_toolbox defaults.
# Scout Mini simulation settings; tune before real hardware use.
#
# 速度上限需要以下几处保持一致，改一处时其余也要同步
# （scout_mini_sim/test/test_odometry_config.py 会检查）：
#   1. controller_server.FollowPath (RPP)：desired_linear_vel、rotate_to_heading_angular_vel，
#      以及 regulated_linear_scaling_min_radius = 线速度 / 角速度上限
#   2. velocity_smoother：max_velocity / max_accel / max_decel（最终发往 /cmd_vel）
#   3. behavior_server：max_rotational_vel（原地旋转恢复行为）
#   4. Gazebo DiffDrive 插件（scout_mini_sim/urdf/scout_mini_rdk.urdf.xacro）：
#      max_linear_velocity=3.0 m/s，max_angular_velocity=0.8 rad/s
# Nav2 的角速度若高于 Gazebo 上限，命令会被底盘截断，车走不出控制器算出的弧线。
amcl:
  ros__parameters:
    use_sim_time: true
    # 运动模型噪声。里程计已融合 IMU 航向（scout_mini_sim/config/ekf.yaml），
    # 比纯轮速可靠，取 0.1；若改回纯轮式里程计应调回 0.2 或更大。
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # 每移动 0.1 m 或转动 0.1 rad 更新一次：修正更频繁，单次位姿跳变更小。
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # 初始位姿由 navigation.launch.py 的 initial_pose 参数改写；
    # 这里的值只在直接用本文件、不经过该 launch 时生效。
    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
